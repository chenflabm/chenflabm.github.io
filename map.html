<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Regiones productoras de hule — Guatemala</title>
<link rel="stylesheet" href="_ds/organic-8c09e36c-0411-4b59-b528-75d1013dc480/styles.css">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg); overflow: hidden; }
  #wrap { position: relative; display: flex; gap: var(--space-4); width: 100%; height: 100%; align-items: stretch; }
  #mapcol { position: relative; flex: 1 1 62%; min-width: 0; }
  svg#map { width: 100%; height: 100%; display: block; }
  .bub { cursor: pointer; }
  #panel {
    flex: 0 0 268px; align-self: center; display: flex; flex-direction: column; gap: 7px;
    font-family: var(--font-body); padding-right: var(--space-4);
  }
  #panel h6 { margin: 0 0 2px; font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
    color: color-mix(in srgb, var(--color-text) 55%, transparent); font-family: var(--font-body); font-weight: 700; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
    padding: 4px 8px; border-radius: 999px; cursor: default; }
  .row.on { background: var(--color-accent-200); }
  .row .nm { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .vl { font-size: 12px; font-variant-numeric: tabular-nums; color: color-mix(in srgb, var(--color-text) 62%, transparent); }
  .bar { grid-column: 1 / -1; height: 4px; border-radius: 999px; background: var(--color-accent-500); }
  #note { font-size: 10.5px; line-height: 1.45; margin-top: 6px;
    color: color-mix(in srgb, var(--color-text) 52%, transparent); }
</style>
</head>
<body>
<div id="wrap">
  <div id="mapcol">
    <svg id="map" aria-label="Mapa de regiones productoras de hule en Guatemala"></svg>
  </div>
  <div id="panel"><h6 id="ph"></h6><div id="rows"></div><div id="note"></div></div>
</div>
<script>
const DEPTS = [
  { name: "Suchitepéquez",  lat: 14.53, lon: -91.50, ha: 31000, region: "Costa Sur" },
  { name: "Escuintla",      lat: 14.28, lon: -90.83, ha: 21500, region: "Costa Sur" },
  { name: "Retalhuleu",     lat: 14.49, lon: -91.72, ha: 15800, region: "Costa Sur" },
  { name: "San Marcos",     lat: 14.78, lon: -92.05, ha: 12400, region: "Costa Sur" },
  { name: "Izabal",         lat: 15.50, lon: -88.85, ha:  9800, region: "Nororiente" },
  { name: "Alta Verapaz",   lat: 15.62, lon: -90.05, ha:  8600, region: "Franja Transversal del Norte" },
  { name: "Quetzaltenango", lat: 14.72, lon: -91.68, ha:  7600, region: "Costa Sur" },
  { name: "Petén",          lat: 16.55, lon: -89.85, ha:  4900, region: "Petén" },
  { name: "Quiché",         lat: 15.82, lon: -90.85, ha:  3100, region: "Franja Transversal del Norte" },
  { name: "Santa Rosa",     lat: 14.15, lon: -90.42, ha:  1300, region: "Costa Sur" },
  { name: "Huehuetenango",  lat: 15.88, lon: -91.42, ha:   691, region: "Franja Transversal del Norte" }
];
const TOTAL = DEPTS.reduce((s, d) => s + d.ha, 0);
const T = {
  es: { head: "Área sembrada por departamento", ha: "ha", note: "Distribución estimada sobre 116,691 ha reportadas en 2022. Cifras por departamento sujetas a confirmación." },
  en: { head: "Planted area by department", ha: "ha", note: "Estimated distribution of the 116,691 ha reported in 2022. Department figures pending confirmation." }
};
let lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "es";
const svgEl = document.getElementById("map");
let gtm, neighbors, projection, r;

const FILL = "color-mix(in srgb, #c67139 55%, transparent)";
const FILL_ON = "#b2622d";

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topo => {
  const feats = topojson.feature(topo, topo.objects.countries).features;
  gtm = feats.find(f => f.properties.name === "Guatemala");
  neighbors = feats.filter(f => ["Mexico", "Belize", "Honduras", "El Salvador"].includes(f.properties.name));
  draw(); renderPanel();
  window.addEventListener("resize", () => { draw(); });
});

function hi(name, on) {
  d3.selectAll(".bub").attr("fill", d => (on && d.name === name) ? FILL_ON : FILL);
  document.querySelectorAll("#rows .row").forEach(el => el.classList.toggle("on", on && el.dataset.n === name));
}

function draw() {
  const w = svgEl.clientWidth || 700, h = svgEl.clientHeight || 520;
  const svg = d3.select(svgEl);
  svg.selectAll("*").remove();
  projection = d3.geoMercator().fitExtent([[w * 0.05, h * 0.06], [w * 0.95, h * 0.94]], gtm);
  const path = d3.geoPath(projection);

  svg.append("g").selectAll("path").data(neighbors).join("path")
    .attr("d", path).attr("fill", "color-mix(in srgb, #201e1d 5%, transparent)")
    .attr("stroke", "var(--color-bg)").attr("stroke-width", 1);

  svg.append("path").datum(gtm).attr("d", path)
    .attr("fill", "var(--color-accent-2-200)")
    .attr("stroke", "var(--color-accent-2-600)").attr("stroke-width", 1.25);

  r = d3.scaleSqrt().domain([0, d3.max(DEPTS, d => d.ha)]).range([2, Math.min(w, h) * 0.085]);

  svg.append("g").selectAll("circle").data(DEPTS).join("circle")
    .attr("class", "bub")
    .attr("cx", d => projection([d.lon, d.lat])[0])
    .attr("cy", d => projection([d.lon, d.lat])[1])
    .attr("r", d => r(d.ha))
    .attr("fill", FILL).attr("stroke", "#8c491a").attr("stroke-width", 1)
    .on("mouseenter", (ev, d) => hi(d.name, true))
    .on("mouseleave", () => hi(null, false));
}

function renderPanel() {
  const t = T[lang], max = d3.max(DEPTS, d => d.ha);
  document.getElementById("ph").textContent = t.head;
  document.getElementById("note").textContent = t.note;
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  DEPTS.forEach(d => {
    const el = document.createElement("div");
    el.className = "row"; el.dataset.n = d.name;
    el.innerHTML = "<div class='nm'>" + d.name + "</div><div class='vl'>" +
      d.ha.toLocaleString(lang === "en" ? "en-US" : "es-GT") + " " + t.ha + "</div>" +
      "<div class='bar' style='width:" + (d.ha / max * 100) + "%'></div>";
    el.addEventListener("mouseenter", () => hi(d.name, true));
    el.addEventListener("mouseleave", () => hi(null, false));
    rows.appendChild(el);
  });
}

window.addEventListener("message", e => {
  if (e.data && (e.data.lang === "es" || e.data.lang === "en")) { lang = e.data.lang; renderPanel(); }
});
</script>
</body>
</html>
